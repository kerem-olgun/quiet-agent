[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-agent"
version = "0.1.0"
description = "Keep your speakers and your screen yours while an AI agent drives a browser on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kerem Olgun" }]
keywords = ["windows", "audio", "ai-agent", "browser-automation", "computer-use", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Testing",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/kerem-olgun/quiet-agent"
Issues = "https://github.com/kerem-olgun/quiet-agent/issues"

[project.scripts]
quiet-agent = "quiet_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
